spring.application.name=server

# Local secrets live in server/.env (git-ignored). See server/.env.example.
spring.config.import=optional:file:.env[.properties]

# Spring Boot 4 uses spring.mongodb.* (spring.data.mongodb.uri is no longer read)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/learnify_db}

# --- Security ---
# JWT signing secret (at least 32 characters). If missing, a random key is used per run.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Initial accounts, created on startup only if they do not exist yet
app.seed.admin-username=${APP_ADMIN_USERNAME:admin}
app.seed.admin-password=${APP_ADMIN_PASSWORD:}
app.seed.teacher-username=${APP_TEACHER_USERNAME:teacher}
app.seed.teacher-password=${APP_TEACHER_PASSWORD:}

# Load sample students/subjects/marks into an EMPTY database (for demos)
app.demo-data.enabled=${DEMO_DATA:false}
